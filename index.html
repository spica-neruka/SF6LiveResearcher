<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090b10" />
  <meta name="description" content="SF6のLIVE配信と配信予定を探すSF6 LIVE" />
  <title>SF6 LIVE — Street Fighter 6 Stream Hub</title>
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/character-assets.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="メインナビゲーション">
      <div class="brand">
        <div class="brand-mark">SF</div>
        <div><strong>SF6 LIVE</strong><span>STREAM HUB</span></div>
      </div>
      <nav>
        <button class="nav-item active" data-view="home"><span>⌂</span>ホーム</button>
        <button class="nav-item" data-view="upcoming"><span>◷</span>配信予定</button>
        <button class="nav-item" data-view="streamers"><span>♙</span>配信者</button>
        <button class="nav-item" data-view="characters"><span>◉</span>キャラクター</button>
        <button class="nav-item" data-view="favorites"><span>♡</span>お気に入り</button>
        <button class="nav-item" data-view="notice"><span>♧</span>お知らせ</button>
        <button class="nav-item" data-view="settings"><span>⚙</span>設定</button>
        <button class="nav-item" data-view="help"><span>?</span>使い方</button>
      </nav>
      <div class="sidebar-note">ログイン不要<br><span>お気に入りはこのブラウザに保存</span></div>
      <div class="socials"><span>YT</span><span>TW</span><span>X</span></div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div>
          <p class="eyebrow">STREET FIGHTER 6 · STREAM HUB</p>
          <h1 id="page-title">ホーム</h1>
        </div>
        <div class="top-actions">
          <div class="timezone">◷ JST</div>
          <label class="search"><span>⌕</span><input id="search-input" type="search" placeholder="配信者やキャラを検索" /></label>
        </div>
      </header>

      <div id="app" aria-live="polite"></div>
    </main>
  </div>
  <script type="module" src="./js/app.js"></script>
  <script src="./js/character-images.js"></script>
  <script>
    // Streamer cards: open the current LIVE video when available,
    // otherwise open the streamer's YouTube channel.
    document.addEventListener('click', async (event) => {
      const card = event.target.closest('.streamer-card');
      if (!card || event.target.closest('.favorite')) return;

      const name = card.querySelector('.streamer-row strong')?.textContent?.trim();
      if (!name) return;

      try {
        const apiBase = window.SF6_API_BASE || 'https://sf6-live-researcher.u-ambers.workers.dev';
        const [streamersResponse, liveResponse] = await Promise.all([
          fetch(`${apiBase}/api/streamers?limit=200`, { cache: 'no-store' }),
          fetch(`${apiBase}/api/videos?status=live&limit=200`, { cache: 'no-store' })
        ]);
        if (!streamersResponse.ok) throw new Error(`streamers API ${streamersResponse.status}`);

        const streamers = (await streamersResponse.json()).items || [];
        const streamer = streamers.find(x => (x.sf6_player_name || x.channel_title || x.channel_id) === name);
        if (!streamer?.channel_id) return;

        let target = `https://www.youtube.com/channel/${encodeURIComponent(streamer.channel_id)}`;
        if (liveResponse.ok) {
          const liveItems = (await liveResponse.json()).items || [];
          const live = liveItems.find(x => x.channel_id === streamer.channel_id && x.status === 'live');
          if (live?.video_id) target = `https://www.youtube.com/watch?v=${encodeURIComponent(live.video_id)}`;
        }
        window.open(target, '_blank', 'noopener');
      } catch (error) {
        console.error('Failed to open streamer destination', error);
      }
    });
  </script>
</body>
</html>
