<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fff044" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="description" content="SF6のLIVE配信と配信予定を探すSF6 LIVE" />
  <title>SF6 LIVE — Street Fighter 6 Stream Hub</title>
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/character-assets.css" />
  <link rel="stylesheet" href="./css/favorites.css" />
  <link rel="stylesheet" href="./css/interface.css" />
  <link rel="stylesheet" href="./css/zapping.css" />
  <link rel="stylesheet" href="./css/responsive.css" />
  <link rel="stylesheet" href="./css/redesign.css" />
</head>
<body>
  <a class="skip-link" href="#app">コンテンツへスキップ</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="メインナビゲーション">
      <a class="brand" href="?" data-go="home" aria-label="SF6 LIVE ホーム"><div class="brand-mark" aria-hidden="true">SF6</div><div><strong>LIVE RESEARCHER</strong><span>Find Your Fighters. Find Your Streams.</span></div></a>
      <nav>
        <button class="nav-item active" data-view="home" type="button"><span aria-hidden="true">⌂</span><span class="nav-label">ホーム</span></button>
        <button class="nav-item nav-explore" data-view="explore" type="button"><span aria-hidden="true">⌕</span><span class="nav-label">探す</span></button>
        <button class="nav-item" data-view="favorites" type="button"><span aria-hidden="true">♡</span><span class="nav-label">お気に入り</span></button>
        <button class="nav-item" data-view="upcoming" type="button"><span aria-hidden="true">▦</span><span class="nav-label">スケジュール</span></button>
      </nav>
      <details class="utility-menu"><summary aria-label="補助メニュー">☰</summary><div><button type="button" data-go="streamers">配信者を探す</button><button type="button" data-go="characters">キャラクターから探す</button><button type="button" data-go="notice">お知らせ</button><button type="button" data-go="settings">設定</button><button type="button" data-go="help">使い方</button></div></details>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <div><p class="eyebrow">STREET FIGHTER 6 · STREAM HUB</p><h1 id="page-title">配信中</h1></div>
        <div class="top-actions">
          <label class="search" for="search-input"><span aria-hidden="true">⌕</span><span class="sr-only" id="search-label">配信を検索</span><input id="search-input" type="search" placeholder="配信者やキャラを検索" aria-describedby="search-hint" autocomplete="off" /></label>
          <div class="fetch-meta"><button id="refresh-button" class="refresh-button" type="button" aria-label="更新" title="更新">↻</button><span id="last-fetched">—</span></div>
          <span class="sr-only" id="search-hint">配信者名、タイトル、キャラクター名で絞り込みます</span>
        </div>
      </header>
      <p id="app-status" class="sr-only" role="status" aria-live="polite"></p>
      <div id="app" tabindex="-1"></div>
    </main>
  </div>
  <script type="module" src="./js/app.js"></script>
  <script src="./js/character-images.js"></script>
</body>
</html>
