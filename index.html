<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090b10" />
  <meta name="description" content="SF6のLIVE配信と配信予定を探すSF6 LIVE" />
  <title>SF6 LIVE — Street Fighter 6 Stream Hub</title>
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/character-assets.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="メインナビゲーション">
      <div class="brand"><div class="brand-mark">SF</div><div><strong>SF6 LIVE</strong><span>STREAM HUB</span></div></div>
      <nav>
        <button class="nav-item active" data-view="home"><span>⌂</span>配信中</button>
        <button class="nav-item" data-view="upcoming"><span>◷</span>配信予定</button>
        <button class="nav-item" data-view="streamers"><span>♙</span>配信者</button>
        <button class="nav-item" data-view="characters"><span>◉</span>キャラクター</button>
        <button class="nav-item" data-view="favorites"><span>♡</span>お気に入り</button>
        <button class="nav-item" data-view="notice"><span>♧</span>お知らせ</button>
        <button class="nav-item" data-view="settings"><span>⚙</span>設定</button>
        <button class="nav-item" data-view="help"><span>?</span>使い方</button>
      </nav>
      <div class="sidebar-note">ログイン不要<br><span>お気に入りはこのブラウザに保存</span></div>
      <div class="socials"><span>YT</span><span>TW</span><span>X</span></div>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <div><p class="eyebrow">STREET FIGHTER 6 · STREAM HUB</p><h1 id="page-title">配信中</h1></div>
        <div class="top-actions"><div class="timezone">◷ JST</div><label class="search"><span>⌕</span><input id="search-input" type="search" placeholder="配信者やキャラを検索" /></label></div>
      </header>
      <div id="app" aria-live="polite"></div>
    </main>
  </div>
  <script type="module" src="./js/app.js"></script>
  <script src="./js/character-images.js"></script>
  <script>
    const SF6_API_BASE = window.SF6_API_BASE || 'https://sf6-live-researcher.u-ambers.workers.dev';
    function favoriteChannelIcon(url, name) {
      return url ? `<img class="channel-icon" src="${String(url).replace(/&/g, '&amp;').replace(/"/g, '&quot;')}" alt="${String(name).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')} のYouTubeチャンネルアイコン" loading="lazy" referrerpolicy="no-referrer">` : '';
    }
    async function renderOfflineFavorites() {
      const favorites = JSON.parse(localStorage.getItem('sf6-live-favorites') || '[]');
      const app = document.querySelector('#app');
      if (!app || document.querySelector('#page-title')?.textContent !== 'お気に入り') return;
      if (!favorites.length) {
        app.innerHTML = `<section class="section"><div class="section-head"><div><h2>お気に入り</h2><p>このブラウザだけに保存されます。アカウントは不要です。</p></div></div><div class="empty">お気に入りの配信者はありません。</div></section>`;
        return;
      }
      try {
        const [streamersResponse, liveResponse] = await Promise.all([
          fetch(`${SF6_API_BASE}/api/streamers?limit=1000`, { cache: 'no-store' }),
          fetch(`${SF6_API_BASE}/api/videos?status=live&limit=200`, { cache: 'no-store' })
        ]);
        if (!streamersResponse.ok) throw new Error(`streamers API ${streamersResponse.status}`);
        const streamers = (await streamersResponse.json()).items || [];
        const liveItems = liveResponse.ok ? ((await liveResponse.json()).items || []) : [];
        const liveByChannel = new Map();
        for (const video of liveItems) if (video.channel_id && !liveByChannel.has(video.channel_id)) liveByChannel.set(video.channel_id, video);
        const items = favorites.map(channelId => {
          const streamer = streamers.find(x => x.channel_id === channelId);
          if (!streamer) return null;
          return { streamer, live: liveByChannel.get(channelId) || null };
        }).filter(Boolean);
        app.innerHTML = `<section class="section"><div class="section-head"><div><h2>お気に入り</h2><p>登録した配信者を、配信中でなくても表示します。</p></div><span class="result-count">${items.length} streamers</span></div><div class="streamer-grid">${items.map(({ streamer, live }) => {
          const name = streamer.sf6_player_name || streamer.channel_title || streamer.channel_id;
          const category = ({pro_gamer:'プロゲーマー',vtuber:'VTuber',game_streamer:'ゲーム配信者'}[streamer.streamer_category] || streamer.streamer_category || '--');
          return `<article class="streamer-card ${live ? 'is-live' : ''}" data-favorite-channel="${streamer.channel_id}" data-live-video="${live?.video_id || ''}">
            <div class="channel-avatar-wrap">${favoriteChannelIcon(streamer.channel_thumbnail_url, name)}</div>
            <div class="streamer-row"><strong>${name.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</strong><button class="favorite on" data-favorite-remove="${streamer.channel_id}" aria-label="お気に入りから削除">♥</button></div>
            <div class="streamer-stats"><span><b>登録者</b>${streamer.subscriber_count != null ? Number(streamer.subscriber_count).toLocaleString() : '--'}</span><span><b>カテゴリ</b>${category.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</span></div>
          </article>`;
        }).join('')}</div></section>`;
      } catch (error) { console.error('Failed to render favorite streamers', error); }
    }
    document.addEventListener('click', async (event) => {
      const navItem = event.target.closest('.nav-item');
      if (navItem?.dataset.view === 'favorites') setTimeout(renderOfflineFavorites, 50);
      const favoriteCard = event.target.closest('[data-favorite-channel]');
      if (favoriteCard) {
        if (event.target.closest('[data-favorite-remove]')) {
          event.stopPropagation();
          const id = event.target.closest('[data-favorite-remove]').dataset.favoriteRemove;
          const favorites = JSON.parse(localStorage.getItem('sf6-live-favorites') || '[]').filter(x => x !== id);
          localStorage.setItem('sf6-live-favorites', JSON.stringify(favorites));
          renderOfflineFavorites();
          return;
        }
        const channelId = favoriteCard.dataset.favoriteChannel;
        const liveVideo = favoriteCard.dataset.liveVideo;
        const target = liveVideo ? `https://www.youtube.com/watch?v=${encodeURIComponent(liveVideo)}` : `https://www.youtube.com/channel/${encodeURIComponent(channelId)}`;
        window.open(target, '_blank', 'noopener');
        return;
      }
      const card = event.target.closest('.streamer-card');
      if (!card || event.target.closest('.favorite')) return;
      const name = card.querySelector('.streamer-row strong')?.textContent?.trim();
      if (!name) return;
      try {
        const response = await fetch(`${SF6_API_BASE}/api/streamers?limit=1000`, { cache: 'no-store' });
        if (!response.ok) throw new Error(`streamers API ${response.status}`);
        const streamers = (await response.json()).items || [];
        const streamer = streamers.find(x => (x.sf6_player_name || x.channel_title || x.channel_id) === name);
        if (streamer?.channel_id) window.open(`https://www.youtube.com/channel/${encodeURIComponent(streamer.channel_id)}`, '_blank', 'noopener');
      } catch (error) { console.error('Failed to open streamer destination', error); }
    });
    const favoriteObserver = new MutationObserver(() => {
      if (document.querySelector('#page-title')?.textContent === 'お気に入り') {
        clearTimeout(window.__sf6FavoriteRenderTimer);
        window.__sf6FavoriteRenderTimer = setTimeout(renderOfflineFavorites, 0);
      }
    });
    favoriteObserver.observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
