name: Restore streamer category filter
on:
  push:
    paths:
      - '.github/workflows/restore-streamer-category-filter.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch app.js
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('js/app.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("streamerPageSize:200,streamerTotal:0,streamerHasNextPage:false,streamerPages:{}", "streamerPageSize:200,streamerTotal:0,streamerHasNextPage:false,streamerPages:{},streamerCategoryFilter:'all'")
          start=s.index('function streamersPage(){')
          end=s.index('function charactersPage(){', start)
          new='''function streamersPage(){const items=state.data.streamers||[],liveByChannel=new Map(streams().filter(s=>s.status==='live').map(s=>[s.streamerId,s])),page=state.streamerPage,total=state.streamerTotal||items.length,totalPages=Math.max(1,Math.ceil(total/state.streamerPageSize)),selectedCategory=state.streamerCategoryFilter||'all';const categories=Object.entries(STREAMER_CATEGORY_LABELS);const pageButtons=Array.from({length:totalPages},(_,i)=>i+1).filter(n=>n===1||n===totalPages||Math.abs(n-page)<=1);let last=0;const pager=pageButtons.map(n=>{const gap=last&&n-last>1?'<span class="pagination-gap">…</span>':'';last=n;return `${gap}<button class="pagination-button ${n===page?'active':''}" data-streamer-page="${n}">${n}</button>`}).join('');return `<section class="section"><div class="section-head"><div><h2>配信者</h2><p>スト6を配信している配信者をチェックできます。</p></div><span class="result-count">${total} streamers</span></div><div class="filter-row"><button class="chip ${selectedCategory==='all'?'active':''}" data-streamer-category="all">すべて</button>${categories.map(([key,label])=>`<button class="chip ${selectedCategory===key?'active':''}" data-streamer-category="${key}">${label}</button>`).join('')}</div><div class="streamer-grid">${items.map(x=>{const live=liveByChannel.get(x.id);const targetUrl=live?.youtubeUrl||x.channelUrl;return `<article class="streamer-card ${live?'is-live':''}" data-streamer-channel="${esc(x.id)}" data-streamer-url="${esc(targetUrl)}"><div class="channel-avatar-wrap">${x.channelThumbnailUrl?`<img class="channel-icon" src="${esc(x.channelThumbnailUrl)}" alt="${esc(x.name)} のYouTubeチャンネルアイコン" loading="lazy" referrerpolicy="no-referrer">`:''}${live?'<span class="live-pill">● LIVE</span>':''}</div><div class="streamer-row"><strong>${esc(x.name)}</strong><button class="favorite ${isFav(x.id)?'on':''}" data-fav="${esc(x.id)}">${isFav(x.id)?'♥':'♡'}</button></div><div class="streamer-stats"><span><b>登録者</b>${x.subscriberCount!=null?Number(x.subscriberCount).toLocaleString():'--'}</span><span><b>カテゴリ</b>${esc(x.streamerCategoryLabel||x.streamerCategory||'--')}</span></div><small>${x.lp!=null?`LP ${esc(x.lp)}`:''}${x.mr!=null?` · MR ${esc(x.mr)}`:''}</small></article>`;}).join('')}</div>${totalPages>1?`<div class="pagination" aria-label="配信者ページ"><button class="pagination-button" data-streamer-page="${page-1}" ${page<=1?'disabled':''}>‹</button>${pager}<button class="pagination-button" data-streamer-page="${page+1}" ${page>=totalPages?'disabled':''}>›</button></div>`:''}</section>`;}
'''
          s=s[:start]+new+s[end:]
          marker='async function fetchStreamers(page=1){'
          if marker not in s: raise SystemExit('fetchStreamers marker not found')
          fs=s.index(marker); fe=s.index('\n', s.index('}', fs))+1
          # Find the next function after fetchStreamers, preserving it.
          m=re.search(r'\nfunction changeStreamerPage\(', s[fs:])
          if not m: raise SystemExit('changeStreamerPage marker not found')
          cstart=fs+m.start()+1
          fetch_new='''async function fetchStreamers(page=1){try{const category=state.streamerCategoryFilter||'all',cacheKey=`${category}:${page}`;const cached=state.streamerPages[cacheKey];if(cached){state.data.streamers=cached.items;state.streamerTotal=cached.total;state.streamerHasNextPage=cached.hasNextPage;state.streamerPage=page;return;}const offset=(page-1)*state.streamerPageSize;const params=new URLSearchParams({limit:String(state.streamerPageSize),offset:String(offset),sort:'subscribers_desc'});if(category!=='all')params.set('category',category);const payload=await fetchJson(`${API_BASE}/api/streamers?${params}`);const items=(payload.items||[]).map(mapStreamer);const result={items,total:Number(payload.total||0),hasNextPage:Boolean(payload.hasNextPage)};state.streamerPages[cacheKey]=result;state.data.streamers=items;state.streamerTotal=result.total;state.streamerHasNextPage=result.hasNextPage;state.streamerPage=page;}catch(e){console.error(e);if(page===1)state.data.streamers=[];}}
'''
          # replace fetch function up to changeStreamerPage
          s=s[:fs]+fetch_new+s[cstart:]
          # Replace changeStreamerPage function body with category-aware page loader.
          marker2='async function changeStreamerPage(page){'
          cs=s.index(marker2); ce=s.index('\n', s.index('}', cs))+1
          # function may be one line; find next function after it
          nm=re.search(r'\nfunction ', s[cs+1:])
          if not nm: raise SystemExit('next function after changeStreamerPage not found')
          cend=cs+1+nm.start()+1
          change_new='''async function changeStreamerPage(page){const totalPages=Math.max(1,Math.ceil((state.streamerTotal||0)/state.streamerPageSize));const next=Math.min(Math.max(Number(page)||1,1),totalPages);await fetchStreamers(next);render();}
'''
          s=s[:cs]+change_new+s[cend:]
          # Add category handler to existing bind without relying on its exact structure.
          insert='''\nasync function changeStreamerCategory(category){const next=category||'all';if(state.streamerCategoryFilter===next)return;state.streamerCategoryFilter=next;state.streamerPage=1;state.data.streamers=[];state.streamerTotal=0;state.streamerHasNextPage=false;state.streamerPages={};await fetchStreamers(1);render();}\ndocument.addEventListener('click',event=>{const categoryButton=event.target.closest('[data-streamer-category]');if(categoryButton){event.preventDefault();changeStreamerCategory(categoryButton.dataset.streamerCategory);}});\n'''
          # Insert before the final load/render startup so functions are defined first.
          s += insert
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/app.js
          git commit -m 'feat: restore streamer category filter' || exit 0
          git push
      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/restore-streamer-category-filter.yml
          git commit -m 'chore: remove one-shot streamer category workflow'
          git push
