name: Download SF6 character assets

on:
  push:
    branches: [main]
    paths-ignore:
      - 'assets/characters/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download official character assets
        run: node scripts/download-character-assets.mjs

      - name: Commit downloaded assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/characters
          if git diff --cached --quiet; then
            echo 'No asset changes.'
            exit 0
          fi
          git commit -m 'chore: add official SF6 character assets'
          git push
